<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="view.css">
</head>
<body class="popup">
  <div class="top">
    <div class="count" id="count">Checking…</div>
    <button class="ico" id="prev" title="Previous" aria-label="Previous">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="ico" id="next" title="Next" aria-label="Next">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button class="ico" id="open-panel" title="Open in side panel" aria-label="Open in side panel">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
    </button>
    <button class="ico" id="savepage" title="Save this page for Claude — reads the page you are looking at and downloads it. It goes nowhere until you send it." aria-label="Save this page">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
    <button class="ico" id="manage" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.3a2 2 0 1 1-4 0V21a1.6 1.6 0 0 0-2.7-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 15H2.8a2 2 0 1 1 0-4H3a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9 4.6V4.3a2 2 0 1 1 4 0v.3a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.6 1.6 0 0 0 19.4 11h.3a2 2 0 1 1 0 4h-.3z"/></svg>
    </button>
  </div>

  <button class="ico" id="rescan" hidden aria-hidden="true"></button>

  <div class="tabs" id="tabs" role="tablist">
    <button class="tab" id="tab-trello" data-view="trello" role="tab">
      Trello<span class="tnum" id="tnum-trello" hidden></span>
    </button>
    <button class="tab" id="tab-canopy" data-view="canopy" role="tab">
      Canopy<span class="tnum" id="tnum-canopy" hidden></span>
    </button>
  </div>

  <div class="bar">
    <button class="pill" id="filter-btn" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.5 10 19 14 21 14 12.5 22 3"/></svg>
      <span id="filter-label">Today</span>
      <span class="pill-dot" id="filter-dot" hidden></span>
    </button>
    <span class="spacer"></span>
    <button class="link" id="followup-link">Weekly follow-up</button>
    <button class="link" id="board-link">Board</button>
    <button class="link" id="filter">Done</button>
    <button class="link" id="clear-all">Clear all</button>

    <div class="pop" id="pop" hidden role="dialog" aria-label="Filters">
      <div class="pop-sec">
        <div class="pop-label">When</div>
        <div class="chips" id="dates"></div>
      </div>
      <div class="pop-sec">
        <div class="pop-label">Board</div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="pop-foot">
        <button class="link" id="reset-filters">Reset to today, all boards</button>
      </div>
    </div>
  </div>

  <div class="ask">
    <input id="ask-input" type="text" placeholder="Ask: who tagged me about paystubs?">
    <button class="btn" id="ask-btn">Ask</button>
  </div>
  <div class="answer" id="answer"></div>

  <div class="wrap" id="wrap"></div>

  <script src="common.js"></script>
  <script src="view.js"></script>
</body>
</html>
