<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nudge — Board</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d10">
<style>
  :root {
    --bg: #ffffff; --card: #f4f4f5; --fg: #18181b; --muted: #71717a;
    --line: #e4e4e7; --accent: #c2410c; --accent-soft: #fff7ed;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0d10; --card: #18181b; --fg: #f4f4f5; --muted: #a1a1aa;
             --line: #2f2f35; --accent: #fb923c; --accent-soft: #2a1a0f; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 0 24px;
  }
  header { padding: 0 16px 12px; }
  h1 { font-size: 19px; margin: 4px 0 2px; }
  .lede { color: var(--muted); font-size: 13px; margin: 0; }
  .back { color: var(--accent); text-decoration: none; font-size: 13px; }

  .searchRow { padding: 0 16px 14px; display: flex; gap: 8px; }
  .searchRow input {
    flex: 1 1 auto; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  .searchRow select {
    flex: 0 0 auto; font: inherit; font-size: 13px; padding: 10px 10px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }

  .board-tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 12px; }
  .board-tab {
    font: inherit; font-size: 12.5px; font-weight: 600; color: var(--muted); background: var(--card);
    border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px; cursor: pointer;
  }
  .board-tab.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .board-tab .n { color: inherit; opacity: .75; font-weight: 700; }

  .board { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 8px;
           scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  .col {
    flex: 0 0 82vw; max-width: 340px; scroll-snap-align: start;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px; min-height: 60vh;
  }
  .col h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    margin: 4px 6px 10px; display: flex; justify-content: space-between;
  }
  .col h2 .n { color: var(--fg); font-weight: 700; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 8px 6px; }

  .item {
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 12px; margin-bottom: 8px; cursor: pointer;
  }
  .item:active { border-color: var(--accent); }
  .item .t { font-weight: 700; font-size: 14.5px; margin-bottom: 2px; overflow-wrap: anywhere; }
  .item .sub { color: var(--muted); font-size: 11px; margin-bottom: 5px; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  .item .due { display: inline-block; color: var(--accent); background: var(--accent-soft);
               font-size: 10.5px; font-weight: 650; padding: 2px 7px; border-radius: 5px; margin-bottom: 6px; }
  .item .b { color: var(--muted); font-size: 12.5px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .item .moves { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
  .item .moves select { flex: 1 1 0; min-width: 0; }
  .item .meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .item .when { color: var(--muted); font-size: 11px; flex: 1 1 auto; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .item a.open { color: var(--muted); font-size: 11px; text-decoration: none; }
  .item a.open:active { color: var(--accent); }
  .item select {
    font: inherit; font-size: 12.5px; font-weight: 550; padding: 5px 7px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  .item .del { color: var(--muted); background: none; border: none; font-size: 16px; line-height: 1;
    padding: 3px 5px; cursor: pointer; border-radius: 5px; }
  .item .del:active { color: var(--accent); background: var(--accent-soft); }
  .item.dragging { opacity: .4; }
  .col.drag-over { background: var(--accent-soft); border-color: var(--accent); }
  .board-tab.drag-over { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

  .status { color: var(--muted); font-size: 13px; padding: 0 16px; }

  /* Phone-first: columns snap-scroll horizontally at a narrow fixed
     width, and the search box just runs full-bleed since a phone screen
     is narrow anyway. Neither holds up on a laptop opened via the
     shareable board link — the fixed 340px columns leave a growing dead
     zone on the right instead of using the space, and a search box
     stretched to the raw viewport width looks broken next to them. Above
     a breakpoint wide enough to show all four columns at once, drop the
     scroll/snap and let each grow to fill an even share of the row
     instead, and cap the whole page at a sane reading width so it isn't
     glued to the left edge of a wide screen. */
  @media (min-width: 860px) {
    header, .board-tabs, .searchRow, .status, .board {
      max-width: 1400px; margin-left: auto; margin-right: auto;
    }
    .board { overflow-x: visible; scroll-snap-type: none; }
    .col { flex: 1 1 0; max-width: none; min-width: 0; }
  }

  /* ---- "Open card" — the full card, tapped open from its tile ----
     `vh` on a phone browser is sized against the tallest the viewport can
     get (address bar collapsed), not what's actually on screen right now —
     with the address bar showing, a sheet sized in vh renders taller than
     the visible area and its last lines are cut off below the fold, not
     scrolled to. `dvh` tracks the real, current viewport instead; the vh
     rule stays first as a fallback for browsers that don't know dvh. */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 50;
    display: flex; align-items: flex-end; justify-content: center; }
  .modal-backdrop[hidden] { display: none; }
  .modal-box { background: var(--bg); border-radius: 16px 16px 0 0; width: 100%; max-width: 480px;
    max-height: 86vh; max-height: 86dvh; display: flex; flex-direction: column;
    box-shadow: 0 -8px 30px rgba(0, 0, 0, .3); }
  @media (min-width: 520px) {
    .modal-backdrop { align-items: center; padding: 6vh 16px; }
    .modal-box { border-radius: 16px; max-height: 88vh; max-height: 88dvh; }
  }
  .modal-head { position: relative; padding: 16px 46px 14px 18px; border-bottom: 1px solid var(--line); }
  .modal-head .t { font-weight: 700; font-size: 16.5px; margin-bottom: 2px; overflow-wrap: anywhere; }
  .modal-head .sub { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .modal-head .due { display: inline-block; color: var(--accent); background: var(--accent-soft);
    font-size: 11px; font-weight: 650; padding: 2px 8px; border-radius: 5px; margin-right: 8px; }
  .modal-head a.open { color: var(--muted); font-size: 11.5px; text-decoration: none; }
  .modal-close { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px;
    border-radius: 8px; border: none; background: none; color: var(--muted); font-size: 20px;
    line-height: 1; cursor: pointer; }
  .modal-body { padding: 14px 18px calc(20px + env(safe-area-inset-bottom)); overflow-y: auto;
    -webkit-overflow-scrolling: touch; flex: 1 1 auto; min-height: 0;
    font-size: 14.5px; color: var(--fg); line-height: 1.55; overflow-wrap: anywhere; }
  .modal-body > div:first-child { margin-top: 0 !important; }
  .modal-body .h { color: var(--accent); font-size: 13.5px; margin: 12px 0 4px; }
  .modal-body .li { position: relative; margin: 5px 0; padding-left: 15px; }
  .modal-body .li::before { content: '\2022'; position: absolute; left: 2px; color: var(--muted); }
  .modal-body .p { margin: 9px 0; }
  .modal-body .empty { color: var(--muted); padding: 0; text-align: left; }

  /* One message, one box — like a chat bubble, so a thread of several
     replies reads as separate messages instead of one continuous block.
     A comment that mentions him is exactly where an action item tends to
     hide in a longer thread — flagged so it doesn't take reading every
     reply to spot. Marks just the handle/name itself, not the whole
     bubble around it. */
  .modal-item {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px 8px; margin: 10px 0;
  }
  .modal-item mark.mention-hit {
    background: var(--accent-soft); color: var(--accent); font-weight: 650;
    border-radius: 3px; padding: 0 2px;
  }
  .modal-item .meta2 { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .modal-item .meta2 b { color: var(--fg); font-weight: 650; }
  .modal-item .hist-text { font-size: 13px; color: var(--fg); line-height: 1.5; }
  .modal-item .hist-text > div:first-child { margin-top: 0 !important; }
</style>
</head>
<body>
<header>
  <a class="back" href="/?settings=1">Settings</a>
  <h1>Board</h1>
  <p class="lede">Every tag lands in Inbox. Tap a card to open it; use the dropdown to move it as you work it.</p>
</header>

<div class="board-tabs" id="boardTabs"></div>

<div class="searchRow">
  <input type="search" id="cardSearch" placeholder="Search cards…" maxlength="200">
  <select id="sortMode" title="Order cards within each column by">
    <option value="due">Sort: Due date</option>
    <option value="added">Sort: Date added</option>
  </select>
</div>

<div class="status" id="status"></div>
<div class="board" id="board"></div>

<div class="modal-backdrop" id="cardModal" hidden>
  <div class="modal-box" id="cardModalBox"></div>
</div>

<script src="board.js"></script>
</body>
</html>
