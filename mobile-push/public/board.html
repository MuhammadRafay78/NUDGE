<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nudge — Board</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d10">
<style>
  :root {
    --bg: #ffffff; --card: #f4f4f5; --fg: #18181b; --muted: #71717a;
    --line: #e4e4e7; --accent: #c2410c; --accent-soft: #fff7ed;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0d10; --card: #18181b; --fg: #f4f4f5; --muted: #a1a1aa;
             --line: #2f2f35; --accent: #fb923c; --accent-soft: #2a1a0f; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 0 24px;
  }
  header { padding: 0 16px 12px; }
  h1 { font-size: 19px; margin: 4px 0 2px; }
  .lede { color: var(--muted); font-size: 13px; margin: 0; }
  .back { color: var(--accent); text-decoration: none; font-size: 13px; }

  .addRow { display: flex; gap: 8px; padding: 0 16px 14px; }
  .addRow input {
    flex: 1; font: inherit; padding: 10px 12px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  .addRow button {
    font: inherit; font-weight: 650; padding: 10px 14px; border-radius: 9px;
    border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  .addRow button:disabled { opacity: .5; }

  .board { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 8px;
           scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  .col {
    flex: 0 0 82vw; max-width: 340px; scroll-snap-align: start;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px; min-height: 60vh;
  }
  .col h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    margin: 4px 6px 10px; display: flex; justify-content: space-between;
  }
  .col h2 .n { color: var(--fg); font-weight: 700; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 8px 6px; }

  .item {
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 12px; margin-bottom: 8px; cursor: pointer;
  }
  .item:active { border-color: var(--accent); }
  .item .t { font-weight: 700; font-size: 14.5px; margin-bottom: 2px; overflow-wrap: anywhere; }
  .item .sub { color: var(--muted); font-size: 11px; margin-bottom: 5px; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  .item .due { display: inline-block; color: var(--accent); background: var(--accent-soft);
               font-size: 10.5px; font-weight: 650; padding: 2px 7px; border-radius: 5px; margin-bottom: 6px; }
  .item .b { color: var(--muted); font-size: 12.5px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .item .meta { display: flex; align-items: center; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
  .item .when { color: var(--muted); font-size: 11px; flex: 1 0 auto; }
  .item a.open { color: var(--muted); font-size: 11px; text-decoration: none; }
  .item a.open:active { color: var(--accent); }
  .item select {
    font: inherit; font-size: 12.5px; font-weight: 550; padding: 5px 7px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  .item .del { color: var(--muted); background: none; border: none; font-size: 16px; line-height: 1;
    padding: 3px 5px; cursor: pointer; border-radius: 5px; }
  .item .del:active { color: var(--accent); background: var(--accent-soft); }

  .status { color: var(--muted); font-size: 13px; padding: 0 16px; }

  /* ---- "Open card" — the full card, tapped open from its tile ---- */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 50;
    display: flex; align-items: flex-end; justify-content: center; }
  .modal-backdrop[hidden] { display: none; }
  .modal-box { background: var(--bg); border-radius: 16px 16px 0 0; width: 100%; max-width: 480px;
    max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(0, 0, 0, .3); }
  @media (min-width: 520px) {
    .modal-backdrop { align-items: center; padding: 6vh 16px; }
    .modal-box { border-radius: 16px; max-height: 88vh; }
  }
  .modal-head { position: relative; padding: 16px 46px 14px 18px; border-bottom: 1px solid var(--line); }
  .modal-head .t { font-weight: 700; font-size: 16.5px; margin-bottom: 2px; overflow-wrap: anywhere; }
  .modal-head .sub { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .modal-head .due { display: inline-block; color: var(--accent); background: var(--accent-soft);
    font-size: 11px; font-weight: 650; padding: 2px 8px; border-radius: 5px; margin-right: 8px; }
  .modal-head a.open { color: var(--muted); font-size: 11.5px; text-decoration: none; }
  .modal-close { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px;
    border-radius: 8px; border: none; background: none; color: var(--muted); font-size: 20px;
    line-height: 1; cursor: pointer; }
  .modal-body { padding: 14px 18px 20px; overflow-y: auto; flex: 1 1 auto;
    font-size: 13.5px; color: var(--fg); line-height: 1.5; overflow-wrap: anywhere; }
  .modal-body > div:first-child { margin-top: 0 !important; }
  .modal-body .h { color: var(--accent); font-size: 13px; margin: 12px 0 4px; }
  .modal-body .li { position: relative; margin: 4px 0; padding-left: 15px; }
  .modal-body .li::before { content: '\2022'; position: absolute; left: 2px; color: var(--muted); }
  .modal-body .p { margin: 8px 0; }
  .modal-body .empty { color: var(--muted); padding: 0; text-align: left; }
</style>
</head>
<body>
<header>
  <a class="back" href="/?settings=1">Settings</a>
  <h1>Board</h1>
  <p class="lede">Every tag lands in Inbox. Tap a card to open it; use the dropdown to move it as you work it.</p>
</header>

<div class="addRow">
  <input type="text" id="newTitle" placeholder="Start a card…" maxlength="200">
  <button id="addBtn">Start</button>
</div>

<div class="status" id="status"></div>
<div class="board" id="board"></div>

<div class="modal-backdrop" id="cardModal" hidden>
  <div class="modal-box" id="cardModalBox"></div>
</div>

<script src="board.js"></script>
</body>
</html>
