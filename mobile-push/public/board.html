<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nudge — Board</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d10">
<style>
  :root {
    --bg: #ffffff; --card: #f4f4f5; --fg: #18181b; --muted: #71717a;
    --line: #e4e4e7; --accent: #c2410c; --accent-soft: #fff7ed;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0d10; --card: #18181b; --fg: #f4f4f5; --muted: #a1a1aa;
             --line: #2f2f35; --accent: #fb923c; --accent-soft: #2a1a0f; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 0 24px;
  }
  header { padding: 0 16px 12px; }
  h1 { font-size: 19px; margin: 4px 0 2px; }
  .lede { color: var(--muted); font-size: 13px; margin: 0; }
  .back { color: var(--accent); text-decoration: none; font-size: 13px; }

  .addRow { display: flex; gap: 8px; padding: 0 16px 14px; }
  .addRow input {
    flex: 1; font: inherit; padding: 10px 12px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  .addRow button {
    font: inherit; font-weight: 650; padding: 10px 14px; border-radius: 9px;
    border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  .addRow button:disabled { opacity: .5; }

  .board { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 8px;
           scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  .col {
    flex: 0 0 82vw; max-width: 340px; scroll-snap-align: start;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px; min-height: 60vh;
  }
  .col h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    margin: 4px 6px 10px; display: flex; justify-content: space-between;
  }
  .col h2 .n { color: var(--fg); font-weight: 700; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 8px 6px; }

  .item {
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 11px; margin-bottom: 8px;
  }
  .item .t { font-weight: 650; font-size: 13.5px; margin-bottom: 3px; }
  .item .b { color: var(--muted); font-size: 12.5px; line-height: 1.4;
             display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .item .meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .item .when { color: var(--muted); font-size: 11px; flex: 1; }
  .item a.open { color: var(--accent); font-size: 11.5px; text-decoration: none; }
  .item select {
    font: inherit; font-size: 12px; padding: 4px 6px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  .item .del { color: var(--muted); background: none; border: none; font-size: 15px; padding: 0 2px; cursor: pointer; }

  .status { color: var(--muted); font-size: 13px; padding: 0 16px; }
</style>
</head>
<body>
<header>
  <a class="back" href="/">&larr; Back</a>
  <h1>Board</h1>
  <p class="lede">Every tag lands in Inbox. Drag it forward as you work it.</p>
</header>

<div class="addRow">
  <input type="text" id="newTitle" placeholder="Start a card…" maxlength="200">
  <button id="addBtn">Start</button>
</div>

<div class="status" id="status"></div>
<div class="board" id="board"></div>

<script src="board.js"></script>
</body>
</html>
