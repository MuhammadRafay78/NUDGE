<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Nudge — Board</title>
  <link rel="stylesheet" href="view.css">
  <style>
    body { width: auto; max-width: 1100px; margin: 0 auto; padding: 26px 20px 60px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .lede { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .bar2 {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 0 0 16px; position: sticky; top: 0; background: var(--bg); z-index: 5;
    }
    .bar2 input[type=text] { flex: 1 1 260px; font: inherit; padding: 8px 10px;
      border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
    .meta { color: var(--muted); font-size: 12px; }

    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; align-items: start; }
    @media (max-width: 900px) { .board { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px) { .board { grid-template-columns: 1fr; } }

    .col { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-height: 200px;
      min-width: 0; transition: background .1s, border-color .1s; }
    .col.drag-over { background: var(--accent-soft); border-color: var(--accent); }
    .col h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
      margin: 4px 6px 10px; display: flex; justify-content: space-between; gap: 8px; }
    .col h2 .n { color: var(--fg); font-weight: 700; }
    .empty { color: var(--muted); font-size: 12.5px; padding: 8px 6px; }

    .item { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; margin-bottom: 8px;
      cursor: grab; min-width: 0; }
    .item.dragging { opacity: .4; }
    .item .t { font-weight: 650; font-size: 13.5px; margin-bottom: 3px; overflow-wrap: anywhere; }
    .item .ctx { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 11px;
                 margin-bottom: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .due { display: inline-block; color: var(--accent); background: var(--accent-soft);
                 font-size: 10.5px; font-weight: 650; padding: 2px 7px; border-radius: 5px; margin-bottom: 6px; }
    .item .b { color: var(--muted); font-size: 12.5px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
    .item .b.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .item .more { color: var(--accent); font-size: 11.5px; background: none; border: none; padding: 4px 0 0; cursor: pointer; }
    .item .row2 { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .item .when { color: var(--muted); font-size: 11px; flex: 1; }
    .item a.open { color: var(--accent); font-size: 11.5px; text-decoration: none; }
    .item .reply-btn { color: var(--accent); font-size: 11.5px; background: none; border: none; padding: 0; cursor: pointer; }
    .item .reply { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
    .item .reply-acts { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .item select { font: inherit; font-size: 12px; padding: 3px 5px; border-radius: 6px;
      border: 1px solid var(--line); background: var(--card); color: var(--fg); }
    .item .del { color: var(--muted); background: none; border: none; font-size: 15px; padding: 0 2px; cursor: pointer; }

    .status { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
    .warn { color: var(--accent); font-size: 13px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Board</h1>
  <p class="lede">Every new tag lands in Inbox, shared with the same board on your paired phone. Drag a card between columns, or use its dropdown.</p>

  <div class="bar2">
    <input type="text" id="newTitle" placeholder="Start a card…" maxlength="200">
    <button class="btn go" id="addBtn">Start</button>
    <span class="spacer" style="flex:1"></span>
    <button class="btn" id="backfillBtn" title="Fill in client name + due date for older cards that were filed before this worked reliably — needs an open Trello tab">Backfill details</button>
    <span class="meta" id="status"></span>
  </div>

  <div id="notConfigured" class="warn" hidden>
    Fill in the server address and pairing code under <b>Settings → Mobile notifications</b> first —
    the board lives on the same server as the phone relay.
  </div>

  <div class="board" id="board"></div>

  <script src="common.js"></script>
  <script src="board.js"></script>
</body>
</html>
