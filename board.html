<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Nudge — Board</title>
  <link rel="stylesheet" href="view.css">
  <style>
    body { width: auto; max-width: 1100px; margin: 0 auto; padding: 26px 20px 60px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .lede { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .bar2 {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 0 0 16px; position: sticky; top: 0; background: var(--bg); z-index: 5;
    }
    .bar2 input[type=text] { flex: 1 1 260px; font: inherit; padding: 8px 10px;
      border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
    .meta { color: var(--muted); font-size: 12px; }
    .search-wrap { position: relative; flex: 1 1 260px; display: flex; }
    .search-wrap input { flex: 1; padding-right: 28px; }
    .search-clear {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      width: 22px; height: 22px; border: none; background: none; color: var(--muted);
      font-size: 15px; line-height: 1; cursor: pointer; border-radius: 5px;
    }
    .search-clear:hover { color: var(--fg); background: var(--line); }
    .item mark { background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 0 1px; }

    .board-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .board-tab {
      font: inherit; font-size: 13px; font-weight: 600; color: var(--muted); background: var(--card);
      border: 1px solid var(--line); border-radius: 9px; padding: 7px 13px; cursor: pointer;
      transition: color .1s, border-color .1s, background .1s;
    }
    .board-tab:hover { color: var(--fg); border-color: var(--accent); }
    .board-tab.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
    .board-tab .n { color: inherit; opacity: .75; font-weight: 700; }

    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; align-items: start; }
    @media (max-width: 900px) { .board { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px) { .board { grid-template-columns: 1fr; } }

    .col { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-height: 200px;
      min-width: 0; transition: background .1s, border-color .1s; }
    .col.drag-over { background: var(--accent-soft); border-color: var(--accent); }
    .col h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
      margin: 4px 6px 10px; display: flex; justify-content: space-between; gap: 8px; }
    .col h2 .n { color: var(--fg); font-weight: 700; }
    .empty { color: var(--muted); font-size: 12.5px; padding: 8px 6px; }

    .item { position: relative; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 26px 10px 11px; margin-bottom: 8px; cursor: grab; min-width: 0; transition: border-color .1s, box-shadow .1s; }
    .item:hover { border-color: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .item:active { cursor: grabbing; }
    .item.dragging { opacity: .4; }
    .item .handle { position: absolute; top: 8px; right: 6px; color: var(--muted); font-size: 13px;
      line-height: 1; letter-spacing: -2px; user-select: none; opacity: .55; }
    .item:hover .handle { opacity: 1; }
    .item .t { font-weight: 700; font-size: 14.5px; margin-bottom: 2px; overflow-wrap: anywhere; padding-right: 10px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item .sub { color: var(--muted); font-size: 11px; margin-bottom: 5px; overflow: hidden;
                 text-overflow: ellipsis; white-space: nowrap; }
    .item .due { display: inline-block; color: var(--accent); background: var(--accent-soft);
                 font-size: 10.5px; font-weight: 650; padding: 2px 7px; border-radius: 5px; margin-bottom: 6px; }
    .item .b { color: var(--muted); font-size: 12.5px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
    .item .b.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .item .more { color: var(--accent); font-size: 11.5px; background: none; border: none; padding: 4px 0 0; cursor: pointer; }
    .item .row2 { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
    .item .when { color: var(--muted); font-size: 11px; flex: 1 1 auto; min-width: 0; }
    .item .move, .item .move-board { font: inherit; color: var(--fg); font-size: 11px; font-weight: 550;
      background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px;
      cursor: pointer; max-width: 108px; }
    .item .move:hover, .item .move-board:hover { border-color: var(--accent); }
    .item .acts { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 9px; }
    .item .acts .hist-btn, .item .acts .reply-btn {
      color: var(--fg); font-size: 11.5px; font-weight: 550; background: var(--card);
      border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer;
      transition: background .1s, border-color .1s;
    }
    .item .acts .hist-btn:hover, .item .acts .reply-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
    .item a.open { color: var(--muted); font-size: 11px; text-decoration: none; align-self: center; }
    .item a.open:hover { color: var(--accent); }

    .item .react { margin-top: 6px; }
    .item button.emo { font-size: 13px; padding: 2px 6px; }
    .item .del { color: var(--muted); background: none; border: none; font-size: 16px; line-height: 1;
      padding: 2px 4px; cursor: pointer; border-radius: 5px; transition: color .1s, background .1s; }
    .item .del:hover { color: var(--accent); background: var(--accent-soft); }

    .status { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
    .warn { color: var(--accent); font-size: 13px; margin-bottom: 10px; }

    /* ---- "Open card" modal — just the comment thread, opened like a real
       Trello card instead of pushing the column layout down ---- */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 50;
      display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow-y: auto; }
    .modal-backdrop[hidden] { display: none; }
    .modal-box { background: var(--bg); border: 1px solid var(--line); border-radius: 14px;
      width: 100%; max-width: 560px; max-height: 88vh; display: flex; flex-direction: column;
      box-shadow: 0 24px 64px rgba(0, 0, 0, .35); }
    .modal-head { position: relative; padding: 18px 46px 14px 20px; border-bottom: 1px solid var(--line); }
    .modal-head .t { font-weight: 700; font-size: 16px; margin-bottom: 2px; overflow-wrap: anywhere; }
    .modal-head .sub { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .modal-head .due { display: inline-block; color: var(--accent); background: var(--accent-soft);
      font-size: 11px; font-weight: 650; padding: 2px 8px; border-radius: 5px; margin-right: 8px; }
    .modal-head a.open { color: var(--muted); font-size: 11.5px; text-decoration: none; }
    .modal-head a.open:hover { color: var(--accent); }
    .modal-close { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px;
      border-radius: 8px; border: none; background: none; color: var(--muted); font-size: 19px;
      line-height: 1; cursor: pointer; }
    .modal-close:hover { background: var(--card); color: var(--fg); }
    .modal-body { padding: 14px 20px; overflow-y: auto; flex: 1 1 auto;
      display: flex; flex-direction: column; gap: 10px; }
    .modal-status { color: var(--muted); font-size: 12.5px; }
    .modal-status.bad { color: var(--accent); font-size: 12.5px; font-weight: 550;
      background: var(--accent-soft); padding: 8px 10px; border-radius: 8px; }
    /* One message, one box — like a chat bubble, so a thread of several
       replies reads as separate messages instead of one continuous block. */
    .modal-item {
      min-width: 0; background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 10px 12px 8px;
    }
    .modal-item .hist-meta { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
    .modal-item .hist-meta b { color: var(--fg); font-weight: 650; }
    .modal-item .hist-text { font-size: 13px; color: var(--fg); line-height: 1.5; overflow-wrap: anywhere; }
    .modal-item .hist-text > div:first-child { margin-top: 0 !important; }
    .modal-item .hist-h { color: var(--accent); font-size: 12.5px; margin: 12px 0 4px; }
    .modal-item .hist-li {
      position: relative; margin: 4px 0; padding-left: 15px;
    }
    .modal-item .hist-li::before { content: '\2022'; position: absolute; left: 2px; color: var(--muted); }
    .modal-item .hist-p { margin: 8px 0; }
    .modal-item .hist-acts { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
    .modal-item .hist-acts .hist-reply-btn { color: var(--accent); font-size: 11.5px; background: none;
      border: none; padding: 0 0 0 4px; cursor: pointer; }
    .modal-item button.emo { font-size: 13px; padding: 2px 6px; }
    .modal-item .react-toggle { color: var(--muted); font-size: 13px; background: none; border: none;
      padding: 2px 6px; cursor: pointer; border-radius: 5px; line-height: 1; }
    .modal-item .react-toggle:hover { color: var(--fg); background: var(--card); }
    .modal-item .react-row { display: flex; align-items: center; gap: 2px; }
    .modal-item .react-row[hidden] { display: none; }
    .modal-foot { padding: 14px 20px 18px; border-top: 1px solid var(--line); }
    .reply-acts { display: flex; align-items: center; gap: 8px; margin-top: 8px; }

    /* ---- daily update: one AI-drafted message of which cards are being
       worked on today, ready to copy and send ---- */
    .bar2 input#updateRecipient { flex: 0 0 140px; font: inherit; font-size: 12.5px; padding: 7px 9px;
      border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
    .update-panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 14px 16px; margin-bottom: 16px; }
    .update-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .update-head b { font-size: 13.5px; }
    .update-head input#updateAutoTime { font: inherit; font-size: 12.5px; padding: 5px 7px;
      border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
    #updateText { width: 100%; font: inherit; font-size: 13.5px; line-height: 1.5; padding: 10px 12px;
      border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
      resize: vertical; min-height: 90px; }
    .meta.ok { color: #16a34a; font-weight: 600; }
    .meta.bad { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Board</h1>
  <p class="lede">Every new tag lands in Inbox, shared with the same board on your paired phone. Drag a card between columns to move it.</p>

  <div class="board-tabs" id="boardTabs"></div>

  <div class="bar2">
    <div class="search-wrap">
      <input type="text" id="cardSearch" placeholder="Search cards… (press / to focus)" maxlength="200">
      <button class="search-clear" id="cardSearchClear" title="Clear search" hidden>&times;</button>
    </div>
    <span class="spacer" style="flex:1"></span>
    <input type="text" id="updateRecipient" placeholder="Update for…" maxlength="60" title="Who this daily update is addressed to">
    <button class="btn go" id="dailyUpdateBtn" title="Use AI to draft a short status update from what's on the board today">Today's update</button>
    <button class="btn" id="backfillBtn" title="Fill in client name + due date for older cards that were filed before this worked reliably — needs an open Trello tab">Backfill details</button>
    <span class="meta" id="status"></span>
  </div>

  <div class="update-panel" id="updatePanel" hidden>
    <div class="update-head">
      <b>Today's update</b>
      <span class="meta" id="updateWhen"></span>
      <span class="spacer" style="flex:1"></span>
      <label class="meta" style="display:flex;align-items:center;gap:5px;cursor:pointer">
        <input type="checkbox" id="updateAuto"> Auto-generate daily at
      </label>
      <input type="time" id="updateAutoTime" title="When the daily update drafts itself">
      <button class="btn" id="updateRegen">Regenerate</button>
      <button class="btn go" id="updateCopy">Copy</button>
      <button class="modal-close" id="updateClose" title="Dismiss" style="position:static">&times;</button>
    </div>
    <textarea id="updateText" rows="5" placeholder="Click “Today's update” to draft it…"></textarea>
    <div class="meta" id="updateStatus" style="margin-top:8px"></div>
  </div>

  <div id="notConfigured" class="warn" hidden>
    Fill in the server address and pairing code under <b>Settings → Mobile notifications</b> first —
    the board lives on the same server as the phone relay.
  </div>

  <div class="board" id="board"></div>

  <div class="modal-backdrop" id="cardModal" hidden>
    <div class="modal-box" id="cardModalBox"></div>
  </div>

  <script src="common.js"></script>
  <script src="board.js"></script>
</body>
</html>
